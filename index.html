<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latino Lighthouse | Spanish Academy for Expats & Professionals</title>
<meta name="description" content="Your guiding light to confident Spanish. Private lessons, courses from beginner to proficiency, masterclasses and free cultural encounters with qualified native teachers.">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@700&display=swap');
body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background:#f8fafc; color:#1e293b; }
html { scroll-behavior: smooth; }
button, [role="button"] { cursor: pointer; }
.heading-serif { font-family: 'Playfair Display', Georgia, serif; font-weight: 700; line-height: 1.1; }
.nav-link { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
.nav-link:hover { color: #EA1E1D; transform: translateY(-1px); }
.class-card { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
.class-card:hover { transform: translateY(-8px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1); }
.offer-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
.offer-card:hover { transform: translateY(-4px); box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); }
.teacher-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
.teacher-card:hover { transform: translateY(-6px); }
.lang-btn { transition: all 0.2s ease; }
.lang-btn.active { background-color: #1B691E; color: white; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
.hero-bg {
  background-image: linear-gradient(rgba(15, 23, 42, 0.25), rgba(15, 23, 42, 0.40)), url('assets/images/HERO-1920.jpg');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
}
.nav-scrolled {
  box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.05), 0 4px 6px -4px rgb(0 0 0 / 0.05);
  background-color: rgba(255,255,255,0.95);
  backdrop-filter: blur(12px);
}
#offer, #courses, #culture, #masterclasses, #conversation, #about, #team, #test { scroll-margin-top: 128px; }
</style>
</head>
<body class="bg-slate-50 text-slate-800">
<div class="hidden bg-emerald-100 text-emerald-700 bg-teal-100 text-teal-700 bg-amber-100 text-amber-700 bg-orange-100 text-orange-700 bg-rose-100 text-rose-700 bg-violet-100 text-violet-700 !border-emerald-700 !bg-emerald-50 !text-emerald-700"></div>
